name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  py-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Read Python version from Dockerfile
        id: docker-python
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re

          dockerfile = Path("Dockerfile").read_text()
          match = re.search(
              r"^FROM\s+python:(\d+\.\d+(?:\.\d+)?)(?=[-@\s]|$)",
              dockerfile,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("No Python version found in Dockerfile")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"python-version={match.group(1)}\n")
          PYTHON

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ steps.docker-python.outputs.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: flake8 check
        run: make flake8-check
      - name: mypy check
        run: make mypy-check
      - name: tests
        run: make tests
