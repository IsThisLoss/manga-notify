[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manga-notify"
dynamic = ["version"]
description = "Tool to get notifications on feeds update"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "isthisloss", email = "kopturovdim@gmail.com" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
  "aiogram==3.31.0",
  # aioresponses 0.7.9 is incompatible with aiohttp 3.14 ClientResponse.
  "aiohttp==3.13.5",
  "aiosql==15.0",
  "arq==0.28.0",
  "asyncpg==0.31.0",
  "beautifulsoup4==4.15.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.4",
  "protobuf==7.36.2",
]

[tool.hatch.version]
path = "manga_notify/__init__.py"

[project.optional-dependencies]
test = [
  "aioresponses==0.7.9",
  "flake8==7.4.1",
  "mypy-extensions==1.1.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]
dev = [
  "types-protobuf==7.35.1.20260906",
  "mypy-protobuf==5.1.0",
  "yandex-pgmigrate==1.0.13",
  "pip-tools==7.6.1",
]

[tool.hatch.build]
include = [
  "manga_notify/**/*.py",
  "manga_notify/**/*.sql"
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
asyncio_default_fixture_loop_scope = "function"
